name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, typecheck, format and CSP
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Preserve the measured 51-warning legacy baseline. Any new warning
      # fails CI; later migration steps ratchet this number down.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Test enforced CSP migration
        run: node --test tests/admin-csp.test.mjs

      - name: Install smoke-test browser
        run: npx playwright install --with-deps chromium

      - name: Run offline admin smoke test
        run: npm run test:smoke
