name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Test enforced CSP migration
        run: node --test tests/admin-csp.test.mjs
